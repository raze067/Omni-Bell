<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E05D25" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Omni" />
    <meta name="description" content="Real-time spatial chime and presence network for all your connected devices." />
    <meta property="og:title" content="Omni" />
    <meta property="og:description" content="Real-time spatial chime and presence network for all your connected devices." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <title>Omni</title>
    <style>
      body {
        margin: 0;
        background-color: #FAF9F7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #FAF9F7;
      }
      .initial-ripple {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle, #E05D25 0%, #D4541F 100%);
        box-shadow: 0 12px 30px rgba(224, 93, 37, 0.35);
        animation: pulseRing 1.4s ease-in-out infinite;
      }
      @keyframes pulseRing {
        0% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(224, 93, 37, 0.4); }
        70% { transform: scale(1.05); box-shadow: 0 0 0 24px rgba(224, 93, 37, 0); }
        100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(224, 93, 37, 0); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-splash">
        <div class="initial-ripple"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
